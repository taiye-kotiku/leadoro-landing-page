<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Leadoro — Cover Image</title>
<link rel="stylesheet" href="styles/leadoro.css"/>
<style>
  body { background: #2A2018; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 40px 20px 80px; }

  .toolbar {
    display: flex; gap: 10px; align-items: center;
    font-family: var(--mono); font-size: 11px; color: #BDB09E;
  }
  .toolbar button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    background: #B8612D; color: #FBF4E6; border: 0; padding: 9px 16px; border-radius: 999px; cursor: pointer;
  }
  .toolbar button:hover { background: #8B4520; }
  .toolbar select {
    font-family: var(--mono); font-size: 11px; background: #18120E; color: #DDD2BE;
    border: 1px solid #4A3826; border-radius: 999px; padding: 8px 14px;
  }

  .frame-wrap {
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    border-radius: 6px;
    overflow: hidden;
  }

  /* ─── THE COVER ─── default 1600×900 ─── */
  #cover {
    width: 1600px;
    height: 900px;
    position: relative;
    background:
      radial-gradient(circle at 78% 30%, rgba(217,164,92,0.16), transparent 45%),
      radial-gradient(circle at 12% 88%, rgba(184,97,45,0.12), transparent 50%),
      #F4EFE6;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--serif);
  }
  #cover.ratio-linkedin { width: 1584px; height: 396px; }
  #cover.ratio-wide { width: 1600px; height: 600px; }
  #cover.ratio-square { width: 1080px; height: 1080px; }

  /* paper grain lines */
  .grain {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(26,22,18,0.015) 0, rgba(26,22,18,0.015) 1px, transparent 1px, transparent 38px);
    pointer-events: none;
  }
  /* corner frame ornament */
  .frame-line { position: absolute; background: var(--line-strong); opacity: 0.6; }

  .cv-inner {
    position: absolute;
    inset: 56px;
    border: 1px solid rgba(201,188,160,0.7);
    border-radius: 4px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .cv-top {
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .cv-brand { display: flex; align-items: center; gap: 18px; }
  .cv-brand svg { width: 64px; height: 64px; }
  .cv-brand .wm { font-size: 40px; letter-spacing: -0.02em; }
  .cv-brand .wm em { font-style: italic; color: var(--copper); }
  .cv-edition {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-mute); text-align: right; line-height: 1.8;
  }
  .cv-edition b { color: var(--copper); font-weight: 500; }

  .cv-center { }
  .cv-eyebrow {
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--copper); margin-bottom: 28px;
  }
  .cv-headline {
    font-size: 128px;
    line-height: 0.92;
    letter-spacing: -0.03em;
    margin: 0;
    max-width: 1180px;
  }
  .cv-headline em { font-style: italic; color: var(--copper); }
  .cv-sub {
    font-style: italic;
    font-size: 28px;
    color: var(--ink-2);
    margin-top: 32px;
    max-width: 720px;
    line-height: 1.4;
  }

  .cv-bottom {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .cv-tags { display: flex; gap: 10px; }
  .cv-tag {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 16px; color: var(--ink-2);
    white-space: nowrap;
  }
  .cv-tag.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .cv-foot-note {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-mute); text-align: right;
  }

  /* big translucent coin watermark */
  .cv-watermark {
    position: absolute;
    right: -120px; bottom: -140px;
    width: 620px; height: 620px;
    opacity: 0.10;
    pointer-events: none;
  }

  /* Compact ratio adjustments */
  #cover.ratio-linkedin .cv-inner { inset: 28px; padding: 32px 44px; }
  #cover.ratio-linkedin .cv-headline { font-size: 60px; max-width: 900px; }
  #cover.ratio-linkedin .cv-sub { display: none; }
  #cover.ratio-linkedin .cv-eyebrow { margin-bottom: 12px; font-size: 11px; }
  #cover.ratio-linkedin .cv-brand svg { width: 44px; height: 44px; }
  #cover.ratio-linkedin .cv-brand .wm { font-size: 28px; }
  #cover.ratio-linkedin .cv-watermark { width: 380px; height: 380px; right: -80px; bottom: -110px; }

  #cover.ratio-wide .cv-headline { font-size: 92px; }
  #cover.ratio-wide .cv-sub { font-size: 24px; margin-top: 22px; }
  #cover.ratio-wide .cv-watermark { width: 460px; height: 460px; }

  #cover.ratio-square .cv-headline { font-size: 74px; }
  #cover.ratio-square .cv-inner { justify-content: space-between; }
  #cover.ratio-square .cv-sub { font-size: 23px; max-width: 560px; margin-top: 24px; }
</style>
</head>
<body>

<!-- reusable coin -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="coinGold2" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#F0D49A"/>
      <stop offset="38%" stop-color="#D9A45C"/>
      <stop offset="72%" stop-color="#B8612D"/>
      <stop offset="100%" stop-color="#8B4520"/>
    </radialGradient>
    <linearGradient id="coinEdge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2DCA8"/>
      <stop offset="100%" stop-color="#7A3C1A"/>
    </linearGradient>
    <symbol id="coin" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="url(#coinEdge2)"/>
      <circle cx="50" cy="50" r="45" fill="url(#coinGold2)"/>
      <circle cx="50" cy="50" r="39.5" fill="none" stroke="#FBF1DC" stroke-width="1.1" stroke-opacity="0.5"/>
      <text x="40" y="69" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="58" fill="#FBF4E6">L</text>
      <circle cx="60" cy="44" r="2.4" fill="#FBF4E6" fill-opacity="0.95"/>
      <circle cx="66" cy="36" r="3.2" fill="#FBF4E6" fill-opacity="0.95"/>
      <circle cx="73" cy="27" r="4.2" fill="#FBF4E6"/>
      <ellipse cx="42" cy="30" rx="22" ry="12" fill="#FFFFFF" fill-opacity="0.14"/>
    </symbol>
    <symbol id="coinSolid" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#B8612D" stroke-width="2.4"/>
      <text x="40" y="69" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="58" fill="#B8612D">L</text>
      <circle cx="60" cy="44" r="2.4" fill="#B8612D"/>
      <circle cx="66" cy="36" r="3.2" fill="#B8612D"/>
      <circle cx="73" cy="27" r="4.2" fill="#B8612D"/>
    </symbol>
  </defs>
</svg>

<div class="toolbar no-print">
  <span>Ratio:</span>
  <select id="ratioSel" onchange="setRatio(this.value)">
    <option value="">1600 × 900 — Standard cover</option>
    <option value="ratio-wide">1600 × 600 — Email / web header</option>
    <option value="ratio-linkedin">1584 × 396 — LinkedIn banner</option>
    <option value="ratio-square">1080 × 1080 — Social square</option>
  </select>
  <button onclick="window.print()">Save / Export</button>
</div>

<div class="frame-wrap">
  <div id="cover" data-screen-label="Cover Image">
    <div class="grain"></div>

    <svg class="cv-watermark"><use href="#coin"/></svg>

    <div class="cv-inner">

      <div class="cv-top">
        <div class="cv-brand">
          <svg><use href="#coin"/></svg>
          <span class="wm">Lead<em>oro</em></span>
        </div>
        <div class="cv-edition">
          Lead-to-Revenue<br/>
          <b>Automation</b>
        </div>
      </div>

      <div class="cv-center">
        <div class="cv-eyebrow">AI WhatsApp Systems</div>
        <h1 class="cv-headline">Turn cold inquiries<br/>into <em>booked revenue.</em></h1>
        <p class="cv-sub">We respond in ten seconds, qualify the lead, and book the appointment — while your competitors are still typing.</p>
      </div>

      <div class="cv-bottom">
        <div class="cv-tags">
          <span class="cv-tag solid">Respond in 10s</span>
          <span class="cv-tag">Qualify</span>
          <span class="cv-tag">Book</span>
          <span class="cv-tag">Follow up</span>
        </div>
        <div class="cv-foot-note">leadoro.com</div>
      </div>

    </div>
  </div>
</div>

<script>
  function setRatio(cls) {
    var c = document.getElementById('cover');
    c.className = cls || '';
  }
</script>
</body>
</html>
