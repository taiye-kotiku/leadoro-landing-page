[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/project/exports/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/services.html"
  to = "/how-it-works.html"
  status = 301

[[redirects]]
  from = "/blog/best-crm-nigerian-service-businesses.html"
  to = "/blog/best-crm-service-businesses.html"
  status = 301

[[redirects]]
  from = "/blog/ai-chatbot-nigerian-clinics.html"
  to = "/blog/ai-chatbot-for-clinics-and-dental-practices.html"
  status = 301

[[redirects]]
  from = "/blog/automate-whatsapp-leads-nigeria.html"
  to = "/blog/automate-whatsapp-leads.html"
  status = 301
